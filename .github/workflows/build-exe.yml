name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements-windows.txt

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-windows.txt
          pip install pyinstaller pywebview

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --clean -y GerenciadorFinancas.spec

      - name: Upload EXE as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GerenciadorFinancas-Windows
          path: dist/GerenciadorFinancas.exe
          retention-days: 30

